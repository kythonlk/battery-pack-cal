<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set & Forget Trading Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">

  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold mb-4">💹 Set & Forget Trading Simulator</h1>

    <!-- Input Form -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div><label class="block">Starting Capital (AED)<input id="capital" type="number" class="w-full p-2 border rounded" value="1000"/></label></div>
      <div><label class="block">Risk per Trade (%)<input id="riskPercent" type="number" class="w-full p-2 border rounded" value="20"/></label></div>
      <div><label class="block">ROI per Win (%)<input id="roiPercent" type="number" class="w-full p-2 border rounded" value="4"/></label></div>
      <div><label class="block">Trades per Week<input id="tradesPerWeek" type="number" class="w-full p-2 border rounded" value="2"/></label></div>
      <div><label class="block">Win Rate (%)<input id="winRate" type="number" class="w-full p-2 border rounded" value="60"/></label></div>
      <div><label class="block">Fee per Trade (AED)<input id="feePerTrade" type="number" class="w-full p-2 border rounded" value="2"/></label></div>
      <div><label class="block">Total Weeks<input id="weeks" type="number" class="w-full p-2 border rounded" value="12"/></label></div>
    </div>

    <button onclick="runSimulation()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
      Calculate
    </button>

    <!-- Results -->
    <div id="results" class="mt-6"></div>
  </div>

  <script>
    function runSimulation() {
      const capitalInput = parseFloat(document.getElementById("capital").value);
      const riskPercent = parseFloat(document.getElementById("riskPercent").value) / 100;
      const roiPercent = parseFloat(document.getElementById("roiPercent").value) / 100;
      const tradesPerWeek = parseInt(document.getElementById("tradesPerWeek").value);
      const winRate = parseFloat(document.getElementById("winRate").value) / 100;
      const feePerTrade = parseFloat(document.getElementById("feePerTrade").value);
      const totalWeeks = parseInt(document.getElementById("weeks").value);

      let resultHTML = `
        <h2 class="text-xl font-bold mb-2">📊 Simulation Results</h2>
        <div class="overflow-x-auto">
        <table class="min-w-full text-sm text-left table-auto border">
          <thead class="bg-gray-200 font-bold">
            <tr>
              <th class="p-2 border">Week</th>
              <th class="p-2 border">Expected Capital</th>
              <th class="p-2 border text-green-600">Best Case</th>
              <th class="p-2 border text-red-600">Worst Case</th>
            </tr>
          </thead>
          <tbody>
      `;

      let expectedCapital = capitalInput;
      let bestCapital = capitalInput;
      let worstCapital = capitalInput;

      for (let week = 1; week <= totalWeeks; week++) {
        const tradeSizeExp = expectedCapital * riskPercent;
        const winsExp = Math.round(tradesPerWeek * winRate);
        const lossesExp = tradesPerWeek - winsExp;
        const profitExp = winsExp * (tradeSizeExp * (1 + roiPercent));
        const lossExp = lossesExp * 0;
        const totalRiskExp = lossesExp * tradeSizeExp;
        const totalFees = tradesPerWeek * feePerTrade;
        expectedCapital = expectedCapital - (winsExp + lossesExp) * tradeSizeExp + profitExp - totalFees;

        // Best Case (all wins)
        const tradeSizeBest = bestCapital * riskPercent;
        const profitBest = tradesPerWeek * (tradeSizeBest * (1 + roiPercent));
        bestCapital = bestCapital - tradesPerWeek * tradeSizeBest + profitBest - totalFees;

        // Worst Case (all losses)
        const tradeSizeWorst = worstCapital * riskPercent;
        const lossWorst = tradesPerWeek * tradeSizeWorst;
        worstCapital = worstCapital - lossWorst - totalFees;

        resultHTML += `
          <tr>
            <td class="border px-2 py-1">${week}</td>
            <td class="border px-2 py-1">${expectedCapital.toFixed(2)} AED</td>
            <td class="border px-2 py-1 text-green-600">${bestCapital.toFixed(2)} AED</td>
            <td class="border px-2 py-1 text-red-600">${worstCapital.toFixed(2)} AED</td>
          </tr>
        `;
      }

      resultHTML += `</tbody></table></div>`;
      document.getElementById("results").innerHTML = resultHTML;
    }
  </script>

</body>
</html>
