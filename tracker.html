<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Demo Account Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">

  <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4 text-center">📘 Demo Account Tracker</h1>

    <div class="mb-4">
      <label class="block font-semibold">Initial Capital (AED)</label>
      <input id="initialCapital" type="number" class="p-2 border rounded w-full" value="1000">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block font-semibold">Trade Result</label>
        <select id="tradeType" class="p-2 border rounded w-full">
          <option value="win">Win</option>
          <option value="loss">Loss</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold">Amount (AED)</label>
        <input id="amount" type="number" class="p-2 border rounded w-full">
      </div>

      <div>
        <label class="block font-semibold">Fee (AED)</label>
        <input id="fee" type="number" class="p-2 border rounded w-full" value="0">
      </div>
    </div>

    <div class="mt-4">
      <label class="block font-semibold">Note (optional)</label>
      <input id="note" type="text" class="p-2 border rounded w-full">
    </div>

    <button onclick="addTrade()" class="mt-4 w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
      ➕ Add Trade
    </button>

    <div class="mt-6 bg-gray-50 p-4 rounded shadow-inner">
      <h2 class="text-xl font-semibold mb-2">💰 Current Balance: <span id="balance">1000.00</span> AED</h2>

      <table class="w-full mt-4 text-sm table-auto border border-collapse">
        <thead>
          <tr class="bg-gray-200">
            <th class="border px-2 py-1">#</th>
            <th class="border px-2 py-1">Type</th>
            <th class="border px-2 py-1">Amount</th>
            <th class="border px-2 py-1">Fee</th>
            <th class="border px-2 py-1">Note</th>
            <th class="border px-2 py-1">New Balance</th>
          </tr>
        </thead>
        <tbody id="historyTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    let balance = 1000;
    let tradeCount = 0;

    function updateBalanceDisplay() {
      document.getElementById("balance").innerText = balance.toFixed(2);
    }

    function addTrade() {
      const tradeType = document.getElementById("tradeType").value;
      const amount = parseFloat(document.getElementById("amount").value);
      const fee = parseFloat(document.getElementById("fee").value);
      const note = document.getElementById("note").value;

      if (tradeCount === 0) {
        balance = parseFloat(document.getElementById("initialCapital").value);
        updateBalanceDisplay();
      }

      if (isNaN(amount) || isNaN(fee)) return alert("Enter valid amount and fee");

      let netChange = tradeType === "win" ? amount - fee : -amount - fee;
      balance += netChange;

      tradeCount++;

      const row = `
        <tr class="text-center">
          <td class="border px-2 py-1">${tradeCount}</td>
          <td class="border px-2 py-1 capitalize ${tradeType === "win" ? "text-green-600" : "text-red-600"}">${tradeType}</td>
          <td class="border px-2 py-1">${amount.toFixed(2)}</td>
          <td class="border px-2 py-1">${fee.toFixed(2)}</td>
          <td class="border px-2 py-1">${note}</td>
          <td class="border px-2 py-1">${balance.toFixed(2)}</td>
        </tr>
      `;
      document.getElementById("historyTable").insertAdjacentHTML("beforeend", row);
      updateBalanceDisplay();

      // Clear fields
      document.getElementById("amount").value = "";
      document.getElementById("fee").value = "0";
      document.getElementById("note").value = "";
    }
  </script>
</body>
</html>
